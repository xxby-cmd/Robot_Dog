sensor_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.15
    two_d_mode: false
    publish_tf: true
    print_diagnostics: true
    transform_timeout: 0.0
    transform_time_offset: 0.0
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    # Feedback-derived height and body velocity only. No command or truth poses.
    odom0: /odom/leg
    odom0_config: [false, false, true,
                   false, false, false,
                   true, true, true,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 20
    imu0: /imu/data
    # Measured acceleration predicts velocity during contact transitions;
    # supporting-foot velocities still bound integration drift. No truth or
    # command-derived measurements, and no absolute simulated yaw fusion.
    imu0_config: [false, false, false,
                  true, true, false,
                  false, false, false,
                  true, true, true,
                  true, true, true]
    imu0_queue_size: 30
    imu0_remove_gravitational_acceleration: true
    # The supplied SDF world's default gravity is 9.8 m/s^2.
    gravitational_acceleration: 9.8
